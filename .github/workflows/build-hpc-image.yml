name: Build NebulonGPT HPC Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare HPC Dockerfile
        run: |
          cp Dockerfile Dockerfile.hpc

          sed -i \
            's/FROM python:3.9-slim AS production/FROM python:3.11-slim AS production/' \
            Dockerfile.hpc

          sed -i \
            '/COPY backend\/requirements.txt \/app\/backend\/requirements.txt/a RUN python -m pip install --upgrade pip setuptools wheel' \
            Dockerfile.hpc

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hpc
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nebulon-gpt-hpc:latest
